name: Feature request
description: Suggest a focused improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compression engine
        - Popup UI
        - ChatGPT/Claude injection
        - Packaging/CI
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: Keeps compression local-first by default
        - label: Does not add telemetry or hidden network calls
        - label: Does not make auto-submit the default path
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
