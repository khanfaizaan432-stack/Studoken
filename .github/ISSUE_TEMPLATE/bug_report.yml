name: Bug report
description: Report a reproducible problem with the extension
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Paste ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compression engine
        - Popup UI
        - ChatGPT injection
        - Claude injection
        - Packaging/CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser/version
      placeholder: Chrome 126, Edge 126, etc.
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add screenshots, console errors, or sample text when safe to share.
