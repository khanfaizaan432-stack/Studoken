<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spectral Chromatin Coiler v2</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 400px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #11111b;
      color: #cdd6f4;
      padding: 16px;
    }
    h1 { font-size: 16px; font-weight:600; margin-bottom:12px; color:#cba6f7; }
    textarea {
      width: 100%;
      height: 160px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 10px;
      color: #cdd6f4;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #cba6f7; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
    }
    .slider-container, .target-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label { font-size:12px; color:#a6adc8; white-space: nowrap; }
    input[type="range"] { flex:1; accent-color:#cba6f7; }
    .value { font-size:13px; font-weight:600; min-width:28px; text-align:right; }
    input[type="number"] {
      width: 70px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 4px;
      color: #cdd6f4;
      padding: 4px;
      font-size: 13px;
    }
    .mode-note {
      font-size: 11px;
      color: #585b70;
      margin-top: -4px;
      margin-bottom: 6px;
    }
    button {
      width: 100%;
      padding: 10px 0;
      background: #cba6f7;
      color: #11111b;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #b4befe; }
    #statusDisplay { margin-top:12px; font-size:13px; text-align:center; min-height:20px; }
    .error { color: #f38ba8; }
    .success { color: #a6e3a1; }
  </style>
</head>
<body>
  <h1>🧬 Spectral Chromatin Coiler v2</h1>
  <textarea id="rawText" placeholder="Paste lecture notes or transcript..."></textarea>
  <div class="row">
    <div class="slider-container">
      <label>Precision</label>
      <input type="range" id="compressionSlider" min="0.2" max="0.8" step="0.01" value="0.5">
      <span class="value" id="sliderValueLabel">50%</span>
    </div>
    <div class="target-container">
      <label>Max tokens</label>
      <input type="number" id="targetTokens" placeholder="auto" min="1">
    </div>
  </div>
  <div class="mode-note">If max tokens is set, precision slider is ignored – the engine will hit exactly that budget.</div>
  <button id="processBtn">⚡ Compress & Inject</button>
  <div id="statusDisplay"></div>

  <script src="popup.js"></script>
</body>
</html>
