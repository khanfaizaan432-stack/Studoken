<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spectral Chromatin Coiler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 430px;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: #11111b;
      color: #cdd6f4;
      padding: 16px;
    }
    h1 { font-size: 17px; font-weight: 750; margin-bottom: 4px; color: #cba6f7; }
    .subtitle { font-size: 12px; color: #a6adc8; margin-bottom: 12px; line-height: 1.35; }
    textarea {
      width: 100%;
      min-height: 130px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 10px;
      padding: 10px;
      color: #cdd6f4;
      font-size: 13px;
      line-height: 1.35;
      resize: vertical;
      outline: none;
    }
    textarea:focus, input:focus { border-color: #cba6f7; }
    .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    .control { flex: 1; }
    label { display: block; font-size: 12px; color: #a6adc8; margin-bottom: 5px; }
    input[type="range"] { width: 100%; accent-color: #cba6f7; }
    input[type="number"] {
      width: 100%;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      color: #cdd6f4;
      padding: 8px;
      font-size: 13px;
    }
    .value { color: #cba6f7; font-weight: 700; }
    .check-row { display: flex; gap: 12px; margin: 8px 0 12px; color: #a6adc8; font-size: 12px; }
    .check-row label { display: flex; align-items: center; gap: 6px; margin: 0; }
    button {
      width: 100%;
      padding: 10px 0;
      background: #cba6f7;
      color: #11111b;
      font-weight: 800;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }
    button.secondary { background: #313244; color: #cdd6f4; }
    button.warning { background: #f9e2af; color: #11111b; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .metric { background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 8px; text-align: center; }
    .metric strong { display: block; color: #a6e3a1; font-size: 13px; }
    .metric span { font-size: 10px; color: #a6adc8; }
    #previewText { min-height: 110px; margin-top: 8px; }
    #statusDisplay { margin-top: 10px; font-size: 12px; text-align: center; min-height: 18px; line-height: 1.35; }
    .error { color: #f38ba8; }
    .success { color: #a6e3a1; }
  </style>
</head>
<body>
  <h1>🧬 Spectral Chromatin Coiler</h1>
  <p class="subtitle">Compress locally, preview first, then copy or inject into ChatGPT/Claude. Nothing leaves your browser.</p>

  <textarea id="rawText" placeholder="Paste notes, transcripts, docs, or long prompts..."></textarea>

  <div class="row">
    <div class="control">
      <label>Context kept: <span class="value" id="sliderValueLabel">50%</span></label>
      <input type="range" id="compressionSlider" min="0.1" max="0.9" step="0.01" value="0.5">
    </div>
    <div class="control">
      <label>Max approx tokens</label>
      <input type="number" id="targetTokens" placeholder="optional" min="1">
    </div>
  </div>

  <div class="row">
    <div class="control">
      <label>Coiling strength: <span class="value" id="strengthValueLabel">80%</span></label>
      <input type="range" id="coilingStrength" min="0.4" max="1.2" step="0.05" value="0.8">
    </div>
  </div>

  <div class="check-row">
    <label><input type="checkbox" id="preserveCode" checked> Preserve code blocks</label>
    <label><input type="checkbox" id="preserveLists" checked> Preserve lists/headings</label>
  </div>

  <button id="processBtn">⚡ Compress</button>

  <div class="metrics">
    <div class="metric"><strong id="metricOriginal">0</strong><span>original</span></div>
    <div class="metric"><strong id="metricCompressed">0</strong><span>compressed</span></div>
    <div class="metric"><strong id="metricSaved">0%</strong><span>saved</span></div>
    <div class="metric"><strong id="metricSentences">0</strong><span>sentences</span></div>
  </div>

  <textarea id="previewText" placeholder="Compressed preview appears here..." readonly></textarea>

  <div class="actions">
    <button class="secondary" id="copyBtn" disabled>Copy</button>
    <button class="secondary" id="injectBtn" disabled>Inject Draft</button>
    <button class="warning" id="autoSubmitBtn" disabled>Auto-submit</button>
  </div>

  <div id="statusDisplay"></div>

  <script src="src/compressor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
