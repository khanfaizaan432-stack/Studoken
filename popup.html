<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spectral Chromatin Coiler</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 370px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #11111b;
      color: #cdd6f4;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #cba6f7;
      letter-spacing: 0.3px;
    }
    textarea {
      width: 100%;
      height: 170px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 10px;
      color: #cdd6f4;
      font-size: 13px;
      resize: vertical;
      outline: none;
      transition: border 0.2s;
    }
    textarea:focus {
      border-color: #cba6f7;
    }
    .slider-container {
      margin: 14px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-container label {
      font-size: 13px;
      color: #a6adc8;
      white-space: nowrap;
    }
    input[type="range"] {
      flex: 1;
      height: 6px;
      accent-color: #cba6f7;
    }
    .slider-value {
      font-size: 13px;
      font-weight: 600;
      color: #cdd6f4;
      min-width: 28px;
      text-align: right;
    }
    button {
      width: 100%;
      padding: 10px 0;
      background: #cba6f7;
      color: #11111b;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    button:hover {
      background: #b4befe;
    }
    button:active {
      transform: scale(0.98);
    }
    #statusDisplay {
      margin-top: 14px;
      font-size: 13px;
      color: #a6adc8;
      min-height: 20px;
      text-align: center;
    }
    .error {
      color: #f38ba8;
    }
    .success {
      color: #a6e3a1;
    }
  </style>
</head>
<body>
  <h1>🧬 Spectral Chromatin Coiler</h1>
  <textarea id="rawText" placeholder="Paste lecture notes or transcript here..."></textarea>
  <div class="slider-container">
    <label for="compressionSlider">Exon retention</label>
    <input type="range" id="compressionSlider" min="0.2" max="0.8" step="0.01" value="0.5">
    <span class="slider-value" id="sliderValueLabel">50%</span>
  </div>
  <button id="processBtn">⚡ Compress &amp; Inject</button>
  <div id="statusDisplay"></div>

  <script src="popup.js"></script>
</body>
</html>
